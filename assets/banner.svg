<svg width="1200" height="320" viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="180" cy="120" r="190"
          fill="url(#pinkGlow)"
          filter="url(#softGlow)"/>

  <circle cx="1030" cy="210" r="220"
          fill="url(#purpleGlow)"
          filter="url(#softGlow)"/>

  <!-- Decorative dots -->
  <circle cx="105" cy="250" r="4" fill="#EC4899" opacity="0.7"/>
  <circle cx="1080" cy="70" r="4" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="1120" cy="105" r="2.5" fill="#58A6FF" opacity="0.8"/>

  <!-- Name -->
  <text x="600" y="125"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="700"
        fill="#F0F6FC">
    Hi, I'm Yuyang 👋
  </text>

  <!-- Subtitle -->
  <text x="600" y="177"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        fill="#C9D1D9">
    Python · AI Agents · Building with AI
  </text>

  <!-- Tagline -->
  <text x="600" y="220"
        text-anchor="middle"
        font-family="monospace"
        font-size="17"
        fill="#EC4899">
    Turning ideas into working products.
  </text>

  <!-- Username -->
  <text x="600" y="265"
        text-anchor="middle"
        font-family="monospace"
        font-size="15"
        fill="#8B949E">
    @Tosidxyy
  </text>

</svg>
